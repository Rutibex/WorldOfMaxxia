<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World of Maxxia · Phase 30 Art Gallery</title><style>
body{margin:0;background:#081119;color:#e8dcc0;font:16px/1.4 Georgia,serif}main{max-width:1400px;margin:0 auto;padding:24px}h1,h2{font-weight:normal;color:#f4d08c}p{color:#c6b894}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;margin:18px 0 34px}.card{background:#14222d;border:1px solid #8f7649;border-radius:14px;padding:10px;text-align:center;box-shadow:0 8px 30px #0005}.card img{width:72px;height:72px;display:block;margin:0 auto 8px}.label{font-size:13px;color:#f1e4c8}.meta{font-size:11px;color:#b9aa8c}.hero{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}.hero img{max-width:100%;border:1px solid #8f7649;border-radius:12px;background:#0f1820}.back{display:inline-block;margin-bottom:18px;color:#f4d08c}
</style></head><body><main><a class="back" href="./index.html">← Back to title</a><h1>Phase 30.1 · Rendered Spell, Item and Combat Feedback Art</h1><p>Repainted, illustrated raster artwork in the spellbook, inventory, shops and combat messages. Cropped from rendered master illustration boards, not geometric drawing code.</p><div class="hero"><img src="./assets/PHASE30_ART_PREVIEW.png" alt="Phase 30 preview sheet"></div><section><h2>Item icons</h2><div id="items" class="grid"></div></section><section><h2>Spell icons</h2><div id="spells" class="grid"></div></section><section><h2>Combat feedback</h2><div id="feedback" class="grid"></div></section></main><script>
const ITEMS=['item_dagger','item_staff','item_mace','item_sword','item_axe','item_spear','item_shortbow','item_crossbow','item_heavy_crossbow','item_greatsword','item_cloth_robe','item_leather_coat','item_ring_mail','item_scale_coat','item_plate_harness','item_buckler','item_round_shield','item_tower_shield','item_copper_ring','item_ward_ring','item_ember_ring','item_frost_ring','item_pilgrim_charm','item_glass_lens','item_lucky_token','item_iron_belt','item_healing_draught','item_greater_healing_draught','item_antidote','item_wake_salts','item_courage_tonic','item_torch','item_smoke_bomb','item_acid_flask','item_spark_capsule','item_healing_scroll','item_venom_flask','item_treasure_gem','item_empty_bottle','item_recall_token','item_bellkeeper_blade','item_cistern_carapace','item_regulator_lens','item_quayward_charm','item_echo_staff','item_glass_thorn','item_custodian_seal','item_tessa_silver_brooch'];
const SPELLS=['spell_wizard_spark_lance','spell_wizard_lantern_globe','spell_wizard_frost_needle','spell_wizard_burning_fan','spell_wizard_glass_eye','spell_wizard_binding_thread','spell_wizard_storm_arc','spell_wizard_unseal','spell_wizard_stone_skin','spell_wizard_fold_step','spell_wizard_mirror_ward','spell_wizard_starfall','spell_priest_mend_flesh','spell_priest_sacred_ember','spell_priest_pilgrim_light','spell_priest_cleanse_venom','spell_priest_steadfast','spell_priest_blessing','spell_priest_healing_chorus','spell_priest_turn_the_hollow','spell_priest_sheltering_hand','spell_priest_break_malison','spell_priest_return_breath','spell_priest_dawn_judgment','spell_witch_withering_word','spell_witch_ill_omen','spell_witch_borrowed_face','spell_witch_leech_kiss','spell_witch_sleep_of_thorns','spell_witch_rat_whisper','spell_witch_crooked_bones','spell_witch_briar_mantle','spell_witch_malice_rain','spell_witch_bottle_the_echo','spell_witch_hearth_thread','spell_witch_black_moon'];
const FEEDBACK=['attack','miss','guard','run','heal','cure','revive','arcane','fire','cold','lightning','holy','poison','necrotic','ward','debuff','bind','sleep','special'];
function titleize(id){return id.replace(/^item_|^spell_/,'').replaceAll('_',' ')}
function mount(target,list,prefix){const root=document.getElementById(target);list.forEach(id=>{const card=document.createElement('div');card.className='card';card.innerHTML=`<img src="./assets/art/${prefix}/${id}.png" alt="${titleize(id)}"><div class="label">${titleize(id)}</div><div class="meta">${id}</div>`;root.append(card);});}
mount('items',ITEMS,'items'); mount('spells',SPELLS,'spells'); mount('feedback',FEEDBACK,'feedback');
</script></body></html>
